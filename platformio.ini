; ============================================================
;  ESP8266 firmware skeleton
;
;  pio run -e serial -t upload   first flash, or recovery
;  pio run -e ota    -t upload   everything after that
;  pio run -e serial -t monitor  serial console
; ============================================================

[platformio]
default_envs = ota

; ------------------------------------------------------------
;  Shared configuration
; ------------------------------------------------------------
[env]
platform  = espressif8266
board     = esp01_1m
framework = arduino

; 1 MB flash, no filesystem: config lives in the SDK's reserved EEPROM
; sector (_EEPROM_start, raw flash read/write, see ConfigStore) instead of
; LittleFS+Preferences. Leaves roughly 500 KB of usable firmware once the
; OTA copy region is accounted for. Watch the "Flash:" line on every build.
board_build.ldscript    = eagle.flash.1m.ld
board_build.flash_mode  = dout

; OTA password: set the OTA_PASSWORD env var before building to require
; auth (kept in sync with [env:ota]'s --auth below); unset = no OTA auth.
build_flags =
  -Wall
  -Wextra
  -fno-exceptions
  -fno-rtti
  -DAPP_STATIC_ALLOC=1
  -DAPP_LOG_BUF_LINES=32
  -DAPP_JSON_BUF_BYTES=512
  -DBUILD_OTA_PASSWORD=\"${sysenv.OTA_PASSWORD}\"
build_src_flags =
  -Wreorder

; Gzips web/ into include/generated/web_assets.h and fails the build
; if the total exceeds custom_web_max_bytes.
extra_scripts        = pre:tools/gen_web_assets.py
custom_web_src       = web
custom_web_out       = include/generated/web_assets.h
custom_web_max_bytes = 24576

monitor_speed   = 115200
monitor_filters = esp8266_exception_decoder

; ------------------------------------------------------------
;  Serial — first flash and recovery
; ------------------------------------------------------------
[env:serial]
upload_protocol = esptool
upload_port     = /dev/cu.usbserial-0001
upload_speed    = 115200
monitor_port    = /dev/cu.usbserial-0001

; No DTR/RTS on the ESP-01S header: GPIO0 must be pulled low and the
; board power-cycled by hand before uploading.
upload_resetmethod = none
upload_flags =
  --before=no_reset
  --after=no_reset

; ------------------------------------------------------------
;  OTA — ArduinoOTA / espota
; ------------------------------------------------------------
[env:ota]
upload_protocol = espota
upload_port     = esp01s.local
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}
  --port=8266

; Serial monitor still needs the adapter; the upload does not.
monitor_port = /dev/cu.usbserial-0001

; ------------------------------------------------------------
;  Heap-check — traps any heap alloc after app.begin() returns
;  pio run -e heapcheck -t upload && pio run -e heapcheck -t monitor
; ------------------------------------------------------------
[env:heapcheck]
extends = env:serial
build_flags =
  ${env.build_flags}
  -DAPP_TRAP_HEAP_ALLOC=1
  -g
